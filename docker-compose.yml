# After deploy / before auth features: npm run migrate:auth (TURSO_URL, TURSO_AUTH_TOKEN)
services:
  app:
    build: .
    ports:
      - "0.0.0.0:3847:3000"
    environment:
      - NODE_ENV=production
      # Turso 数据库（可选）
      # - TURSO_URL=libsql://xxx.turso.io
      # - TURSO_AUTH_TOKEN=xxx
    volumes:
      - ./refero.db:/app/refero.db
    restart: unless-stopped
    shm_size: '2gb'